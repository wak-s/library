<title>대학생 실전 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 가운데 한 줄 기둥(최대 720px). 공책 한 페이지처럼 위에서 아래로 읽는 구조 */

/* ============================================================
   [수정 포인트 A] 색깔 — 여기 숫자만 바꾸면 사이트 전체 색이 바뀜
   (피그마의 '컬러 스타일'과 같은 역할)
   ============================================================ */
:root {
  --bg: #F4F5F2;        /* 페이지 바탕 */
  --surface: #FFFFFF;   /* 카드·버튼 바탕 */
  --ink: #1C211F;       /* 기본 글자 */
  --muted: #66706B;     /* 날짜·설명 같은 흐린 글자 */
  --line: #DCE0DA;      /* 구분선 */
  --accent: #1F6F5C;    /* 강조색 (로그인 버튼 등) */
  --accent-ink: #FFFFFF;
  --tag-ai: #2B5BA6;    /* 태그: AI·자동화 */
  --tag-notion: #44403C;/* 태그: 노션 */
  --tag-ops: #95560F;   /* 태그: 운영 */

  --font-display: "Gowun Batang", "Noto Serif KR", serif;   /* 제목 글꼴 */
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; /* 본문 글꼴 */
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;   /* 날짜 글꼴 */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131715; --surface: #1B201E; --ink: #E6EBE8; --muted: #98A39E;
    --line: #2B322F; --accent: #5DBFA3; --accent-ink: #0E1412;
    --tag-ai: #86AEEA; --tag-notion: #C9C3BC; --tag-ops: #E3A55A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131715; --surface: #1B201E; --ink: #E6EBE8; --muted: #98A39E;
  --line: #2B322F; --accent: #5DBFA3; --accent-ink: #0E1412;
  --tag-ai: #86AEEA; --tag-notion: #C9C3BC; --tag-ops: #E3A55A;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.7;
}
.wrap {
  max-width: 720px;
  margin: 0 auto;
  padding-inline: 20px;
  padding-block: 28px 64px;
}

/* ---------- 상단 머리 (사이트 이름 + 로그인 버튼) ---------- */
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--line);
}
.brand {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.15rem;
  color: var(--ink);
  text-decoration: none;
}
.btn {
  font: 500 0.9rem/1 var(--font-body);
  padding: 10px 16px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
}
.btn:hover { border-color: var(--muted); }
.btn-primary {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
}
.btn-primary:hover { filter: brightness(1.08); border-color: var(--accent); }
.btn:focus-visible, .row:focus-visible, .back:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

/* ---------- 소개 ---------- */
.intro { padding-block: 36px 28px; }
.intro h1 {
  font-family: var(--font-display);
  font-size: clamp(1.6rem, 4.5vw, 2.1rem);
  line-height: 1.35;
  margin: 0 0 10px;
  text-wrap: balance;
}
.intro p { margin: 0; color: var(--muted); max-width: 34em; }

/* ---------- 글 목록 (한 줄 목록형) ---------- */
.list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.row {
  display: grid;
  grid-template-columns: 88px 1fr auto;
  align-items: baseline;
  gap: 16px;
  padding-block: 18px;
  border-bottom: 1px solid var(--line);
  color: inherit;
  text-decoration: none;
}
.row:hover .row-title { text-decoration: underline; text-underline-offset: 4px; }
.date {
  font-family: var(--font-mono);
  font-size: 0.82rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.row-title { font-weight: 500; min-width: 0; }
.tag {
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  white-space: nowrap;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid currentColor;
}
.tag-ai { color: var(--tag-ai); }
.tag-notion { color: var(--tag-notion); }
.tag-ops { color: var(--tag-ops); }
.example-note { margin-top: 14px; font-size: 0.8rem; color: var(--muted); }

@media (max-width: 520px) {
  .row { grid-template-columns: 1fr auto; gap: 4px 12px; }
  .row .date { grid-column: 1 / -1; }
}

/* ---------- 글 페이지 ---------- */
.back {
  display: inline-block;
  margin-top: 28px;
  color: var(--muted);
  text-decoration: none;
  font-size: 0.9rem;
}
.back:hover { color: var(--ink); }
.post-head { padding-block: 20px 8px; }
.post-head h1 {
  font-family: var(--font-display);
  font-size: clamp(1.5rem, 4.2vw, 2rem);
  line-height: 1.4;
  margin: 12px 0 8px;
  text-wrap: balance;
}
.post-body { max-width: 65ch; }
.post-body p { margin: 0 0 1.1em; }

/* ============================================================
   [수정 포인트 B] 잠금 효과 — 흐림 정도와 사라지는 높이
   blur(4px) 숫자를 키우면 더 흐려지고, max-height를 줄이면 덜 보임
   ============================================================ */
.locked {
  position: relative;
  max-height: 220px;
  overflow: hidden;
}
.locked-text {
  filter: blur(4px);
  user-select: none;
  pointer-events: none;
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 85%);
          mask-image: linear-gradient(to bottom, #000 0%, transparent 85%);
}
.gate {
  margin-top: -40px;
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 24px 20px;
  text-align: center;
  display: grid;
  gap: 12px;
  justify-items: center;
}
.gate strong { font-family: var(--font-display); font-size: 1.15rem; }
.gate p { margin: 0; color: var(--muted); font-size: 0.92rem; }

/* ---------- 안내 메시지 (토스트) ---------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  max-width: calc(100% - 32px);
  background: var(--ink);
  color: var(--bg);
  padding: 12px 18px;
  border-radius: 10px;
  font-size: 0.9rem;
}
</style>

<div class="wrap">
  <header class="top">
    <a class="brand" href="#" id="brand"></a>
    <button class="btn" id="loginTop" type="button">로그인</button>
  </header>

  <!-- 메인 화면 -->
  <main id="home">
    <section class="intro">
      <h1 id="headline"></h1>
      <p id="subline"></p>
    </section>
    <ul class="list" id="list"></ul>
    <p class="example-note">지금 보이는 글은 화면 확인용 예시예요.</p>
  </main>

  <!-- 글 화면 -->
  <article id="post" hidden>
    <a class="back" href="#">← 목록으로</a>
    <div class="post-head">
      <span class="tag" id="postTag"></span>
      <h1 id="postTitle"></h1>
      <span class="date" id="postDate"></span>
    </div>
    <div class="post-body" id="postPreview"></div>
    <div class="locked">
      <div class="post-body locked-text" id="postLocked"></div>
    </div>
    <div class="gate">
      <strong>여기부터는 회원 공개예요</strong>
      <p>구글 계정으로 10초 만에 가입하고 끝까지 읽어 보세요.</p>
      <button class="btn btn-primary" id="loginGate" type="button">구글로 로그인하고 이어 읽기</button>
    </div>
  </article>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script>
/* ============================================================
   [수정 포인트 C] 사이트 이름과 소개 문구
   ============================================================ */
const SITE = {
  name: "대학생 실전 노트",
  headline: "비전공 대학생이 직접 해 보고 남긴 일 잘하는 법",
  subline: "AI·자동화, 노션, 운영과 퍼실리테이션. 해 본 것만 씁니다."
};

/* 태그 이름 → 색깔 이름 짝 (새 주제를 만들면 여기에 한 줄 추가) */
const TAGS = {
  "AI·자동화": "tag-ai",
  "노션": "tag-notion",
  "운영": "tag-ops"
};

/* ============================================================
   [수정 포인트 D] 글 목록 — 글 하나 = { } 묶음 하나
   preview: 누구나 보는 앞부분 / locked: 로그인해야 보이는 뒷부분
   새 글을 쓰려면 { } 하나를 복사해서 맨 위에 붙이고 내용만 바꾸면 됨
   ============================================================ */
const POSTS = [
  {
    id: "drive-kakao",
    date: "2026.10.09",
    tag: "AI·자동화",
    title: "드라이브에 파일이 올라오면 카톡으로 알림 받기 (비전공자 버전)",
    preview: [
      "멘토 200명의 자료를 매일 확인하다 보면, 일의 절반은 '올라왔나?' 하고 폴더를 여는 일이 됩니다.",
      "그래서 반대로 만들었습니다. 내가 폴더를 보러 가는 대신, 폴더가 나에게 알려 주게."
    ],
    locked: [
      "준비물은 구글 드라이브, 카카오톡 나와의 채팅방, 그리고 Claude 하나입니다.",
      "핵심은 '최근 24시간 안에 새로 생긴 파일'만 골라 세는 것. 학교별 건수만 짧게 보내면 아침에 3초면 확인이 끝납니다.",
      "아래에서 실제로 쓴 조회 조건과 메시지 형식을 그대로 공개합니다."
    ]
  },
  {
    id: "notion-one-db",
    date: "2026.10.06",
    tag: "노션",
    title: "PARA 안 쓰고 노션을 DB 하나로 정리한 이유",
    preview: [
      "정리법 영상을 보면 다들 폴더를 네 칸으로 나눕니다. 프로젝트, 영역, 자원, 보관.",
      "따라 해 봤는데, 저한테는 칸이 너무 많았어요. 어디에 넣을지 고민하다 아무 데도 안 넣게 되더라고요."
    ],
    locked: [
      "그래서 칸을 하나로 줄이고, 대신 '유형' 태그를 여러 개 달 수 있게 바꿨습니다.",
      "자소서는 따로 DB를 만들지 않고 필터 보기 하나로 해결했어요.",
      "실제 태그 목록과 필터 설정 화면을 공유합니다."
    ]
  },
  {
    id: "mentor-checklist",
    date: "2026.10.02",
    tag: "운영",
    title: "멘토 178명에게 자료를 빠짐없이 걷는 체크리스트",
    preview: [
      "15개 학교, 178명의 멘토. 마감일에 '아직 안 냈어요'가 열 명만 나와도 하루가 사라집니다.",
      "급한 순서가 아니라 '연락하면 답이 오래 걸릴 사람' 순서로 챙기기 시작하면서 달라졌습니다."
    ],
    locked: [
      "엑셀로 피드백이 많이 필요한 멘토를 먼저 골라내는 기준 세 가지.",
      "학교·멘토·학생 사이 연락이 꼬이지 않게 만든 체크리스트 양식도 그대로 드립니다."
    ]
  },
  {
    id: "prompt-material",
    date: "2026.09.23",
    tag: "AI·자동화",
    title: "좋은 프롬프트의 대부분은 지시가 아니라 재료다",
    preview: [
      "잘 만든 프롬프트 하나를 열어 봤더니, 지시문은 11줄이고 나머지 655줄은 전부 재료였습니다.",
      "AI에게 '잘해 줘'라고 쓰는 대신 무엇을 건네줘야 하는지가 보였어요."
    ],
    locked: [
      "역할 → 재료 → 지시 → 확인 순서로 프롬프트를 짜는 방법.",
      "제가 실제로 쓰는 템플릿을 복사해서 바로 쓸 수 있게 붙여 둡니다."
    ]
  },
  {
    id: "change-question",
    date: "2026.09.19",
    tag: "운영",
    title: "회의 분위기는 질문 하나로 바뀐다",
    preview: [
      "퍼실리테이션을 10년 하면서 배운 건, 좋은 진행은 말을 잘하는 게 아니라 질문을 바꾸는 일이라는 것.",
      "'의견 있으신가요?'라고 물으면 조용해지는 이유부터 이야기해 볼게요."
    ],
    locked: [
      "침묵을 깨는 질문, 갈등을 낮추는 질문, 결론을 끌어내는 질문.",
      "상황별로 바로 꺼내 쓸 수 있는 질문 문장 12개를 정리했습니다."
    ]
  }
];

/* ---------- 아래부터는 화면을 그리는 부분 (평소엔 안 건드려도 됨) ---------- */
const $ = (id) => document.getElementById(id);

function paragraphs(lines) {
  return lines.map((t) => `<p>${t}</p>`).join("");
}

// 메인 목록 그리기: POSTS 배열을 한 줄씩 목록으로 바꿈
function renderList() {
  $("list").innerHTML = POSTS.map((p) => `
    <li>
      <a class="row" href="#${p.id}">
        <span class="date">${p.date}</span>
        <span class="row-title">${p.title}</span>
        <span class="tag ${TAGS[p.tag] || ""}">${p.tag}</span>
      </a>
    </li>`).join("");
}

// 글 화면 그리기: 앞부분은 그대로, 뒷부분은 흐리게
function renderPost(p) {
  $("postTag").textContent = p.tag;
  $("postTag").className = "tag " + (TAGS[p.tag] || "");
  $("postTitle").textContent = p.title;
  $("postDate").textContent = p.date;
  $("postPreview").innerHTML = paragraphs(p.preview);
  $("postLocked").innerHTML = paragraphs(p.locked);
}

// 주소 끝(#글id)을 보고 목록/글 화면 중 무엇을 보여줄지 결정
function route() {
  const id = location.hash.slice(1);
  const post = POSTS.find((p) => p.id === id);
  $("home").hidden = !!post;
  $("post").hidden = !post;
  if (post) renderPost(post);
  window.scrollTo(0, 0);
}

// 로그인 버튼: 지금은 안내만. 3단계에서 진짜 구글 로그인으로 교체
let toastTimer;
function notReadyYet() {
  const t = $("toast");
  t.textContent = "아직 연결 전이에요. 3단계에서 진짜 구글 로그인이 붙어요.";
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}

$("brand").textContent = SITE.name;
$("headline").textContent = SITE.headline;
$("subline").textContent = SITE.subline;
$("loginTop").addEventListener("click", notReadyYet);
$("loginGate").addEventListener("click", notReadyYet);
window.addEventListener("hashchange", route);
renderList();
route();
</script>
