<title>대학생 실전 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 가운데 한 줄 기둥(최대 720px). 공책 한 페이지처럼 위에서 아래로 읽는 구조 */

/* ============================================================
   [수정 포인트 A] 색깔 — 여기 숫자만 바꾸면 사이트 전체 색이 바뀜
   (피그마의 '컬러 스타일'과 같은 역할)
   ============================================================ */
:root {
  --bg: #F4F5F2;        /* 페이지 바탕 */
  --surface: #FFFFFF;   /* 카드·버튼 바탕 */
  --ink: #1C211F;       /* 기본 글자 */
  --muted: #66706B;     /* 날짜·설명 같은 흐린 글자 */
  --line: #DCE0DA;      /* 구분선 */
  --accent: #1F6F5C;    /* 강조색 (로그인 버튼 등) */
  --accent-ink: #FFFFFF;
  --tag-ai: #2B5BA6;    /* 태그: AI·자동화 */
  --tag-notion: #44403C;/* 태그: 노션 */
  --tag-ops: #95560F;   /* 태그: 운영 */

  --font-display: "Gowun Batang", "Noto Serif KR", serif;   /* 제목 글꼴 */
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; /* 본문 글꼴 */
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;   /* 날짜 글꼴 */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131715; --surface: #1B201E; --ink: #E6EBE8; --muted: #98A39E;
    --line: #2B322F; --accent: #5DBFA3; --accent-ink: #0E1412;
    --tag-ai: #86AEEA; --tag-notion: #C9C3BC; --tag-ops: #E3A55A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131715; --surface: #1B201E; --ink: #E6EBE8; --muted: #98A39E;
  --line: #2B322F; --accent: #5DBFA3; --accent-ink: #0E1412;
  --tag-ai: #86AEEA; --tag-notion: #C9C3BC; --tag-ops: #E3A55A;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.7;
}
.wrap {
  max-width: 720px;
  margin: 0 auto;
  padding-inline: 20px;
  padding-block: 28px 64px;
}

/* ---------- 상단 머리 (사이트 이름 + 로그인 버튼) ---------- */
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--line);
}
.brand {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.15rem;
  color: var(--ink);
  text-decoration: none;
}
.btn {
  font: 500 0.9rem/1 var(--font-body);
  padding: 10px 16px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
}
.btn:hover { border-color: var(--muted); }
.btn-primary {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
}
.btn-primary:hover { filter: brightness(1.08); border-color: var(--accent); }
.btn:focus-visible, .row:focus-visible, .back:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

/* ---------- 소개 ---------- */
.intro { padding-block: 36px 28px; }
.intro h1 {
  font-family: var(--font-display);
  font-size: clamp(1.6rem, 4.5vw, 2.1rem);
  line-height: 1.35;
  margin: 0 0 10px;
  text-wrap: balance;
}
.intro p { margin: 0; color: var(--muted); max-width: 34em; }

/* ---------- 글 목록 (한 줄 목록형) ---------- */
.list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.row {
  display: grid;
  grid-template-columns: 88px 1fr auto;
  align-items: baseline;
  gap: 16px;
  padding-block: 18px;
  border-bottom: 1px solid var(--line);
  color: inherit;
  text-decoration: none;
}
.row:hover .row-title { text-decoration: underline; text-underline-offset: 4px; }
.date {
  font-family: var(--font-mono);
  font-size: 0.82rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.row-title { font-weight: 500; min-width: 0; }
.tag {
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  white-space: nowrap;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid currentColor;
}
.tag-ai { color: var(--tag-ai); }
.tag-notion { color: var(--tag-notion); }
.tag-ops { color: var(--tag-ops); }
.example-note { padding-block: 18px; font-size: 0.85rem; color: var(--muted); list-style: none; }

@media (max-width: 520px) {
  .row { grid-template-columns: 1fr auto; gap: 4px 12px; }
  .row .date { grid-column: 1 / -1; }
}

/* ---------- 글 페이지 ---------- */
.back {
  display: inline-block;
  margin-top: 28px;
  color: var(--muted);
  text-decoration: none;
  font-size: 0.9rem;
}
.back:hover { color: var(--ink); }
.post-head { padding-block: 20px 8px; }
.post-head h1 {
  font-family: var(--font-display);
  font-size: clamp(1.5rem, 4.2vw, 2rem);
  line-height: 1.4;
  margin: 12px 0 8px;
  text-wrap: balance;
}
.post-body { max-width: 65ch; }
.post-body p { margin: 0 0 1.1em; }

/* ============================================================
   [수정 포인트 B] 잠금 효과 — 흐림 정도와 사라지는 높이
   blur(4px) 숫자를 키우면 더 흐려지고, max-height를 줄이면 덜 보임
   ============================================================ */
.locked {
  position: relative;
  max-height: 220px;
  overflow: hidden;
}
.locked-text {
  filter: blur(4px);
  user-select: none;
  pointer-events: none;
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 85%);
          mask-image: linear-gradient(to bottom, #000 0%, transparent 85%);
}
.gate {
  margin-top: -40px;
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 24px 20px;
  text-align: center;
  display: grid;
  gap: 12px;
  justify-items: center;
}
.gate strong { font-family: var(--font-display); font-size: 1.15rem; }
.gate p { margin: 0; color: var(--muted); font-size: 0.92rem; }

/* ---------- 안내 메시지 (토스트) ---------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  max-width: calc(100% - 32px);
  background: var(--ink);
  color: var(--bg);
  padding: 12px 18px;
  border-radius: 10px;
  font-size: 0.9rem;
}
</style>

<div class="wrap">
  <header class="top">
    <a class="brand" href="#" id="brand"></a>
    <button class="btn" id="authBtn" type="button">로그인</button>
  </header>

  <!-- 메인 화면 -->
  <main id="home">
    <section class="intro">
      <h1 id="headline"></h1>
      <p id="subline"></p>
    </section>
    <ul class="list" id="list"><li class="example-note">글을 불러오는 중이에요…</li></ul>
  </main>

  <!-- 글 화면 -->
  <article id="post" hidden>
    <a class="back" href="#">← 목록으로</a>
    <div class="post-head">
      <span class="tag" id="postTag"></span>
      <h1 id="postTitle"></h1>
      <span class="date" id="postDate"></span>
    </div>
    <div class="post-body" id="postPreview"></div>

    <!-- 로그인한 회원에게 보이는 본문 -->
    <div class="post-body" id="postFull" hidden></div>

    <!-- 로그인 안 한 사람에게 보이는 잠금 -->
    <div id="lockArea">
      <div class="locked">
        <div class="post-body locked-text" aria-hidden="true">
          <p>이어지는 내용은 회원에게만 공개돼요. 실제로 써 본 과정과 화면, 바로 따라 할 수 있는 양식까지 담았어요.</p>
          <p>구글 계정으로 가입하면 모든 글을 끝까지 읽을 수 있어요. 가입은 버튼 한 번이면 끝나요.</p>
          <p>새 글이 올라오면 목록 맨 위에서 바로 확인할 수 있어요.</p>
        </div>
      </div>
      <div class="gate">
        <strong>여기부터는 회원 공개예요</strong>
        <p>구글 계정으로 10초 만에 가입하고 끝까지 읽어 보세요.</p>
        <button class="btn btn-primary" id="loginGate" type="button">구글로 로그인하고 이어 읽기</button>
      </div>
    </div>
  </article>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<!-- Supabase 도구 불러오기 (회원 관리·글 보관함과 대화하는 통로) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ============================================================
   [수정 포인트 C] 사이트 이름과 소개 문구
   ============================================================ */
const SITE = {
  name: "대학생 실전 노트",
  headline: "비전공 대학생이 직접 해 보고 남긴 일 잘하는 법",
  subline: "AI·자동화, 노션, 운영과 퍼실리테이션. 해 본 것만 씁니다."
};

/* 태그 이름 → 색깔 이름 짝 (새 주제를 만들면 여기에 한 줄 추가) */
const TAGS = {
  "AI·자동화": "tag-ai",
  "노션": "tag-notion",
  "운영": "tag-ops"
};

/* ============================================================
   [수정 포인트 D] Supabase 연결 정보
   - URL: 내 Supabase 프로젝트 주소
   - KEY: 공개용 열쇠(publishable key). 브라우저에 넣어도 안전한 키
   ※ 글 내용은 이제 이 파일이 아니라 Supabase의 posts / post_bodies 표에서 관리
   ============================================================ */
const SUPABASE_URL = "https://cowrdbhmrsglkgyoqzsx.supabase.co";
const SUPABASE_KEY = "sb_publishable_OoFaujJQfTbF3zCZTA5Ayg_AHLGZROY";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { flowType: "pkce" }
});

/* ---------- 아래부터는 화면을 그리는 부분 (평소엔 안 건드려도 됨) ---------- */
const $ = (id) => document.getElementById(id);
let POSTS = [];
let user = null;

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const paragraphs = (lines) => (lines || []).map((t) => `<p>${esc(t)}</p>`).join("");

// 목록 그리기
function renderList() {
  if (!POSTS.length) {
    $("list").innerHTML = `<li class="example-note">아직 올라온 글이 없어요.</li>`;
    return;
  }
  $("list").innerHTML = POSTS.map((p) => `
    <li>
      <a class="row" href="#${esc(p.id)}">
        <span class="date">${esc(p.date)}</span>
        <span class="row-title">${esc(p.title)}</span>
        <span class="tag ${TAGS[p.tag] || ""}">${esc(p.tag)}</span>
      </a>
    </li>`).join("");
}

// 글 화면 그리기: 로그인했으면 본문을 받아오고, 아니면 잠금 표시
async function renderPost(p) {
  $("postTag").textContent = p.tag;
  $("postTag").className = "tag " + (TAGS[p.tag] || "");
  $("postTitle").textContent = p.title;
  $("postDate").textContent = p.date;
  $("postPreview").innerHTML = paragraphs(p.preview);

  $("postFull").hidden = true;
  $("lockArea").hidden = false;
  if (!user) return;

  const { data, error } = await db.from("post_bodies").select("body").eq("post_id", p.id).maybeSingle();
  if (error || !data) { toast("본문을 불러오지 못했어요. 새로고침해 주세요."); return; }
  $("postFull").innerHTML = paragraphs(data.body);
  $("postFull").hidden = false;
  $("lockArea").hidden = true;
}

// 주소 끝(#글id)을 보고 목록/글 화면 중 무엇을 보여줄지 결정
function route() {
  const id = location.hash.slice(1);
  const post = POSTS.find((p) => p.id === id);
  $("home").hidden = !!post;
  $("post").hidden = !post;
  if (post) renderPost(post);
  window.scrollTo(0, 0);
}

// 오른쪽 위 버튼: 로그인 상태에 따라 글자 바꾸기
function renderAuth() {
  $("authBtn").textContent = user ? "로그아웃" : "로그인";
}

// 구글 로그인: 지금 보던 글을 기억해 두고 구글로 이동
async function login() {
  try { sessionStorage.setItem("returnTo", location.hash); } catch (e) {}
  const { error } = await db.auth.signInWithOAuth({
    provider: "google",
    options: { redirectTo: location.origin + location.pathname }
  });
  if (error) toast("로그인 창을 열지 못했어요. 잠시 뒤 다시 눌러 주세요.");
}

async function logout() {
  await db.auth.signOut();
  toast("로그아웃했어요.");
}

let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}

async function start() {
  $("brand").textContent = SITE.name;
  $("headline").textContent = SITE.headline;
  $("subline").textContent = SITE.subline;
  $("authBtn").addEventListener("click", () => (user ? logout() : login()));
  $("loginGate").addEventListener("click", login);
  window.addEventListener("hashchange", route);

  // 로그인 상태가 바뀔 때마다 화면 다시 그리기
  db.auth.onAuthStateChange((_event, session) => {
    user = session?.user ?? null;
    renderAuth();
    if (!$("post").hidden) route();
  });

  // 구글에서 돌아왔으면 주소창 정리 + 보던 글로 복귀
  const { data } = await db.auth.getSession();
  user = data.session?.user ?? null;
  renderAuth();
  if (location.search.includes("code=")) {
    let back = "";
    try { back = sessionStorage.getItem("returnTo") || ""; sessionStorage.removeItem("returnTo"); } catch (e) {}
    history.replaceState(null, "", location.pathname + back);
    if (user) toast("로그인했어요. 이제 끝까지 읽을 수 있어요.");
  }

  // 글 목록 불러오기 (누구나 읽을 수 있는 posts 표)
  const res = await db.from("posts").select("id,date,tag,title,preview").order("date", { ascending: false });
  if (res.error) {
    $("list").innerHTML = `<li class="example-note">글을 불러오지 못했어요. 새로고침해 주세요.</li>`;
    return;
  }
  POSTS = res.data;
  renderList();
  route();
}

start();
</script>
